name: Add Named Firms (verified registry)

on:
  workflow_dispatch:
    inputs:
      firms:
        description: 'Comma-separated firm names to look up and add'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - working-directory: scraper
        env:
          FIRMS: ${{ github.event.inputs.firms }}
        run: python add_firms.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: add verified firms $(date -u +%Y-%m-%d)"
          git push
