name: Enrich CNCEF addresses (detail pages)

on:
  # Cron quotidien désactivé — refresh hebdo via weekly-refresh.yml (lundi 14h Paris)
  # schedule:
  #   - cron: '30 6 * * *'   # Daily 06:30 UTC (after CNCEF scrape at 06:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 lxml
      - working-directory: scraper
        run: python enrich_cncef_details.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: CNCEF address enrichment $(date -u +%Y-%m-%d)"
          git push
