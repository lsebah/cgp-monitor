name: Discover Recent CGP (created < N days)

on:
  # DISABLED 2026-06-30: the recherche-entreprises discovery produced records
  # with SIREN inconsistent with their creation date (all 1xx for 2026 firms),
  # i.e. unreliable / non-existent cabinets. Re-enable only after the source is
  # verified. Manual trigger kept for diagnostics.
  # schedule:
  #   - cron: '30 5 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back window in days'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  discover-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - working-directory: scraper
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
        run: python discover_recent.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: discover recent CGP (created < N days) $(date -u +%Y-%m-%d)"
          git push
