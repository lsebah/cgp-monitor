name: ORIAS Fast Update

on:
  schedule:
    - cron: '0 3 * * *'   # Every day 03:00 UTC - fast ORIAS-only refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orias-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas openpyxl xlrd

      - name: Run ORIAS fast update
        working-directory: scraper
        run: python orias_update.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: ORIAS fast update $(date -u +%Y-%m-%d)"
          git push
