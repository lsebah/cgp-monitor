name: Test Folk API (diagnostic)
on:
  workflow_dispatch:
    inputs:
      folk_key:
        description: 'Folk API Key'
        required: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - working-directory: scraper
        env:
          FOLK_KEY: ${{ github.event.inputs.folk_key }}
        run: python test_folk.py
