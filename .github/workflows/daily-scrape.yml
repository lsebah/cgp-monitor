name: Daily CGP Scrape

on:
  schedule:
    # Run every day at 2 AM UTC (3 AM CET)
    - cron: '0 2 * * *'
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CGP Monitor scraper
        run: |
          cd scraper
          python main.py

      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "=== Changes detected ==="
            git diff --name-only
          fi

      - name: Commit and push updates
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "CGP Monitor Bot"

          # Get summary for commit message
          MEMBER_COUNT=$(python -c "import json; data = json.load(open('docs/data/members.json')); print(len(data.get('members', [])))")
          NEW_COUNT=$(python -c "import json; data = json.load(open('docs/data/new_members.json')); print(len(data.get('new_members', [])))")

          git add docs/data/
          git commit -m "data: daily scrape update

- Total CGPs: $MEMBER_COUNT
- New this week: $NEW_COUNT
- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          git push

      - name: No changes detected
        if: steps.verify.outputs.changed == 'false'
        run: echo "ℹ️ No data changes detected - database is up to date"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: scraper-logs
          retention-days: 7
