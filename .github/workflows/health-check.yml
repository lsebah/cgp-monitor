name: Health Check (boucle de contrôle)

# Vérifie que le refresh hebdomadaire a bien eu lieu et que les données sont
# saines. Tourne le lundi à 17:00 UTC (après le refresh de 12:00 UTC qui dure
# ~2-3h) + le jeudi en filet de sécurité. Publie docs/data/health.json
# (affiché par le site) et ouvre/commente une issue GitHub si problème.
on:
  schedule:
    - cron: '0 17 * * 1'   # lundi 17:00 UTC — contrôle post-refresh
    - cron: '0 8 * * 4'    # jeudi 08:00 UTC — filet de sécurité mi-semaine
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Run health check
        id: health
        working-directory: scraper
        continue-on-error: true
        run: python health_check.py

      - name: Publish health.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs/data/health.json
          git diff --staged --quiet || git commit -m "data: health check $(date -u +%Y-%m-%d)"
          git push

      - name: Open issue on failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Health check FAILED $(date -u +%Y-%m-%d)"
          BODY="Le contrôle automatique a détecté un problème bloquant.

          \`\`\`
          $(cat docs/data/health.json)
          \`\`\`

          Voir le run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --label health --state open --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label health || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail the run if unhealthy
        if: steps.health.outcome == 'failure'
        run: exit 1
