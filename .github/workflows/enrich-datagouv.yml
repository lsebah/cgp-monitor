name: Enrich data.gouv

on:
  # Cron quotidien désactivé — refresh hebdo via weekly-refresh.yml (lundi 14h Paris)
  # schedule:
  #   - cron: '0 5 * * *'   # Daily 05:00 UTC (before the association scrapes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4 lxml
      - working-directory: scraper
        run: python enrich_datagouv.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: data.gouv enrichment $(date -u +%Y-%m-%d)"
          git push
