name: Discover CGP (NAF 66.19B, official registry)

on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max new firms to add this run'
        required: false
        default: '6000'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - working-directory: scraper
        env:
          CAP: ${{ github.event.inputs.cap || '6000' }}
        run: python discover_cgp.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: discover CGP (NAF 66.19B) $(date -u +%Y-%m-%d)"
          git push
