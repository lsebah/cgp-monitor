name: Weekly Refresh (lundi 14h Paris)

# Refresh hebdomadaire complet du site, tous les lundis.
# Cron GitHub = UTC : 12:00 UTC = 14:00 Paris en été (CEST). En hiver (CET)
# cela devient 13:00 Paris — GitHub ne gère pas les fuseaux dans les crons.
# Remplace les anciens crons quotidiens (désactivés) : un seul passage
# hebdomadaire est aussi plus doux pour les serveurs sources (throttle CNCEF).
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps (incl. Playwright for CNCGP/contacts)
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      # Ordre: scrapes d'abord, enrichissements ensuite.
      # continue-on-error sur chaque étape : une source en panne ne doit pas
      # bloquer le reste du pipeline (chaque script pose son scrape_status,
      # et le health-check remonte les erreurs après coup).
      - name: 1/6 ANACOFI + AFFO
        working-directory: scraper
        continue-on-error: true
        run: python scrape_anacofi_affo.py

      - name: 2/6 CNCEF (garde anti-régression intégrée)
        working-directory: scraper
        continue-on-error: true
        run: python scrape_cncef.py

      - name: 3/6 CNCGP
        working-directory: scraper
        continue-on-error: true
        run: python scrape_cncgp.py

      - name: 4/6 Enrichissement data.gouv (dates, dirigeants, purge fermés)
        working-directory: scraper
        continue-on-error: true
        run: python enrich_datagouv.py

      - name: 5/6 Enrichissement adresses CNCEF (fiches détail)
        working-directory: scraper
        continue-on-error: true
        run: python enrich_cncef_details.py

      - name: 6/6 Enrichissement contacts (sites web)
        working-directory: scraper
        continue-on-error: true
        run: python enrich_contacts.py

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: weekly refresh $(date -u +%Y-%m-%d)"
          git push
